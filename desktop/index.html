<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LATIF VPN CONTROL</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060914;
      color: #f4f7ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      height: 56px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(96, 165, 250, 0.25);
      background: rgba(13, 20, 40, 0.92);
    }
    .topbar.hidden { display: none; }
    .brand { font-weight: 800; letter-spacing: 0.08em; font-size: 1.05rem; }
    .pill {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid rgba(245, 158, 11, 0.55);
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.14);
    }
    .pill.connected {
      border-color: rgba(16, 185, 129, 0.6);
      color: #10b981;
      background: rgba(16, 185, 129, 0.14);
    }
    .workspace {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 12px 16px;
    }
    .left {
      width: min(390px, 34vw);
      background: rgba(13, 20, 40, 0.88);
      border: 1px solid rgba(96, 165, 250, 0.3);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .left.hidden { display: none; }
    .right {
      flex: 1;
      background: rgba(13, 20, 40, 0.88);
      border: 1px solid rgba(96, 165, 250, 0.3);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .right-bar {
      height: 46px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(96, 165, 250, 0.25);
      background: rgba(6, 9, 20, 0.9);
      gap: 8px;
    }
    .right-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
    }
    .btn {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.55);
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .country-btn {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(96, 165, 250, 0.35);
      background: rgba(6, 9, 20, 0.72);
      color: #f4f7ff;
      text-align: left;
      cursor: pointer;
      font-weight: 600;
    }
    .country-btn.active { border-color: #38bdf8; background: rgba(59, 130, 246, 0.22); }
    .mini-btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(96, 165, 250, 0.35);
      background: rgba(59, 130, 246, 0.14);
      color: #38bdf8;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .note { font-size: 0.82rem; color: #a3b4d4; line-height: 1.45; }
  </style>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand">LATIF VPN CONTROL</div>
    <div class="pill" id="statusPill">Disconnected</div>
  </header>

  <div class="workspace">
    <aside class="left" id="leftPanel">
      <h3>NordVPN Control</h3>
      <button class="btn" id="nordAccountBtn">NordVPN Account</button>
      <button class="country-btn active" data-country="Ireland">Ireland (Dublin)</button>
      <button class="country-btn" data-country="Sweden">Sweden (Stockholm)</button>
      <button class="country-btn" id="disconnectBtn" style="border-color:rgba(245,158,11,0.55); color:#f59e0b;">Disconnect</button>
      <p class="note" id="nordNote">Click Ireland or Sweden to connect via official NordVPN using your NordVPN account.</p>
    </aside>

    <section class="right">
      <div class="right-bar">
        <div style="display:flex; gap:6px;">
          <button class="mini-btn" id="backBtn">Back</button>
          <button class="mini-btn" id="reloadBtn">Reload</button>
        </div>
        <span id="hostLabel" style="font-family:monospace; color:#38bdf8; font-size:0.84rem;">https://elevenlabs.io/</span>
        <button class="mini-btn" id="fullBtn">Full Screen</button>
      </div>
      <div class="right-placeholder" id="placeholder">
        <h2>Embedded ElevenLabs Browser</h2>
        <p class="note" style="max-width:420px;">Opens official ElevenLabs directly inside this desktop WebView panel without opening any external browser tab.</p>
        <button class="btn" id="openElevenBtn">OPEN ELEVENLABS</button>
      </div>
    </section>
  </div>

  <script>
    const statusPill = document.getElementById("statusPill");
    const nordNote = document.getElementById("nordNote");
    const hostLabel = document.getElementById("hostLabel");
    const placeholder = document.getElementById("placeholder");

    window.latifControl.onUrlChanged((url) => {
      hostLabel.textContent = url;
    });

    document.getElementById("openElevenBtn").addEventListener("click", async () => {
      placeholder.style.display = "none";
      hostLabel.textContent = await window.latifControl.openEmbeddedUrl("https://elevenlabs.io/");
    });

    document.getElementById("nordAccountBtn").addEventListener("click", async () => {
      placeholder.style.display = "none";
      hostLabel.textContent = await window.latifControl.openEmbeddedUrl("https://my.nordaccount.com/");
    });

    document.getElementById("backBtn").addEventListener("click", () => window.latifControl.goBack());
    document.getElementById("reloadBtn").addEventListener("click", () => window.latifControl.reloadBrowser());
    document.getElementById("fullBtn").addEventListener("click", async () => {
      const full = await window.latifControl.toggleFullScreen();
      document.getElementById("topbar").classList.toggle("hidden", full);
      document.getElementById("leftPanel").classList.toggle("hidden", full);
      document.getElementById("fullBtn").textContent = full ? "Exit Full Screen" : "Full Screen";
    });

    document.querySelectorAll(".country-btn[data-country]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        document.querySelectorAll(".country-btn[data-country]").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const res = await window.latifControl.connectNordCountry(btn.dataset.country);
        nordNote.textContent = res.message;
        if (res.connected === true) {
          statusPill.textContent = "Connected";
          statusPill.classList.add("connected");
        }
      });
    });

    document.getElementById("disconnectBtn").addEventListener("click", async () => {
      const res = await window.latifControl.disconnectNord();
      nordNote.textContent = res.message;
      if (res.connected === false) {
        statusPill.textContent = "Disconnected";
        statusPill.classList.remove("connected");
      }
    });
  </script>
</body>
</html>
